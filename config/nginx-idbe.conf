# Pretendo LAN : icônes des jeux (liste d'amis), gardées pour toujours sur ce serveur.
# Pour un jeu qui n'est pas installé, la console demande son icône à
# idbe-wup.cdn.nintendo.net (Wii U) ou idbe-ctr.cdn.nintendo.net (3DS).
# Une icône déjà présente dans /opt/pretendo/icones/ est servie sans interroger Nintendo.
# Sinon elle est demandée à Nintendo et, si Nintendo l'a (réponse 200), enregistrée en
# fichier : jamais expirée, jamais écrasée par une erreur, servie aussi hors ligne.
# Les icônes sont du contenu Nintendo : elles restent sur ce serveur (pas dans le dépôt).
#
# Chaque réponse de Nintendo autre que 200 est notée dans icones/manquantes.log
# (date, wup/ctr, adresse demandée, code, console) : 403 = icône absente chez Nintendo,
# 5xx = Nintendo injoignable. La console essaie d'abord <jeu>-<version>.idbe puis
# <jeu>.idbe : un jeu n'est vraiment sans icône que si aucune des deux n'est enregistrée.
map $status $idbe_non_recue {
    200     0;
    default 1;
}
log_format idbe_manquante '$time_iso8601 $idbe_dir $uri $status $http_x_real_ip';

server {
    listen 80;
    server_name idbe-wup.cdn.nintendo.net idbe-ctr.cdn.nintendo.net
                idbe-wup.cdn.pretendo.cc idbe-ctr.cdn.pretendo.cc;

    # résolution par des DNS publics (le DNS interne renverrait vers ce serveur)
    resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout 3s;

    set $idbe_dir wup;
    set $idbe_upstream idbe-wup.cdn.nintendo.net;
    if ($host ~ "ctr") {
        set $idbe_dir ctr;
        set $idbe_upstream idbe-ctr.cdn.nintendo.net;
    }

    root /var/lib/pretendo-icones;
    default_type application/octet-stream;

    location /icondata/ {
        try_files /$idbe_dir$uri @nintendo;
        add_header X-Pretendo-LAN-Icone local;
    }

    location @nintendo {
        proxy_pass https://$idbe_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $idbe_upstream;
        proxy_set_header Host $idbe_upstream;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;

        # enregistrement seulement des réponses complètes 200 (fichier temporaire sur le même disque)
        proxy_store /var/lib/pretendo-icones/$idbe_dir$uri;
        proxy_store_access user:rw group:rw all:r;
        proxy_temp_path /var/lib/pretendo-icones/.tmp;
        add_header X-Pretendo-LAN-Icone nintendo;

        # journaux habituels (redéfinis : un access_log dans ce bloc remplace ceux hérités)
        access_log /var/log/nginx/access.log main;
        access_log /dev/stdout main;
        access_log /var/lib/pretendo-icones/manquantes.log idbe_manquante if=$idbe_non_recue;
    }

    location / {
        return 404;
    }
}
