# Pretendo LAN : configuration de nginx-sssl (HTTPS des Wii U sans homebrew, SSSL).
# Reprise de config/nginx-sssl.conf d'upstream, avec en plus :
#  - le nom demandé par la console (SNI) noté dans le journal (sni=…) ;
#  - les blocs de Pretendo LAN posés par l'installateur dans lan.d/ (icônes des jeux :
#    certificat propre, présenté selon le nom demandé).
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] $host "$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for" $request_time sni=$ssl_server_name';

    access_log /var/log/nginx/access.log main;
    access_log /dev/stdout main;
    error_log /var/log/nginx/error.log info;
    error_log /dev/stderr info;

    server {
        listen 80 default_server;
        listen 443 ssl default_server;

        # Let the primary Nginx server handle everything
        location / {
            proxy_pass http://nginx;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Fowarded-Proto $scheme;
        }

        ssl_protocols TLSv1 TLSv1.1;
        ssl_ciphers ALL;
        ssl_prefer_server_ciphers on;
        ssl_certificate /opt/nginx/ssl/ca.pem;
        ssl_certificate_key /opt/nginx/ssl/private.key;
    }

    include /opt/nginx/conf/lan.d/*.conf;
}
