# Pretendo LAN : portail web accessible par l'IP du serveur (http://IP:WEB_PORT).
# Le site Pretendo n'est servi que pour le nom « pretendo.network », que le navigateur
# d'un PC du réseau ne sait pas joindre. Ce portail :
#  - présente le site sous ce nom ;
#  - réécrit le domaine des cookies (.pretendo.network) pour que la connexion tienne ;
#  - sert les images de Mii du CDN local sous /cdn/ (sinon images cassées sur PC) ;
#  - transmet le lien de confirmation des mails au serveur de comptes.
server {
    listen 8888;

    location / {
        set $upstream http://website:8080;
        proxy_pass $upstream;
        proxy_set_header Host pretendo.network;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cookie_domain ~^\.?(www\.)?pretendo\.network$ $host;
        proxy_redirect ~^https?://(?:www\.)?pretendo\.network/(.*)$ /$1;

        # réécriture des URL absolues du CDN dans les pages
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/css application/javascript application/json;
        sub_filter 'http://cdn.pretendo.cc/' '/cdn/';
        sub_filter 'https://cdn.pretendo.cc/' '/cdn/';
        sub_filter 'https://pretendo-cdn.b-cdn.net/' '/cdn/';
    }

    # lien de confirmation des mails (/v1/email/verify) : API du serveur de comptes
    location /v1/email/ {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host api.pretendo.cc;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CDN local (bucket MinIO pn-cdn) : images de Mii, etc.
    location /cdn/ {
        set $cdn http://pn-cdn.minio.pretendo.cc;
        rewrite ^/cdn(/.*)$ $1 break;
        proxy_pass $cdn;
    }
}
