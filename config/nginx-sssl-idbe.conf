# Pretendo LAN : icônes des jeux (idbe) pour les Wii U en SSSL.
# Chez Nintendo, ce serveur est signé par « Nintendo Class 2 CA - G3 », pas par le
# « Nintendo CA - G3 » du SSSL : la console refuserait le certificat SSSL habituel.
# L'installateur applique la même modification SSSL à ce CA (console-files/idbe/) ;
# ce certificat n'est présenté qu'aux connexions qui demandent ces noms (SNI).
# Validé le 16/11/2026 : la Wii U envoie le nom et accepte ce certificat.
server {
    listen 443 ssl;
    server_name idbe-wup.cdn.nintendo.net idbe-ctr.cdn.nintendo.net;

    location / {
        proxy_pass http://nginx;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Fowarded-Proto $scheme;
    }

    ssl_protocols TLSv1 TLSv1.1;
    ssl_ciphers ALL;
    ssl_prefer_server_ciphers on;
    ssl_certificate /opt/nginx/ssl/idbe/cert-chain.pem;
    ssl_certificate_key /opt/nginx/ssl/idbe/private-key.pem;
}
