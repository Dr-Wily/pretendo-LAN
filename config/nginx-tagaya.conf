# Pretendo LAN : relais du service de versions « tagaya » de Nintendo (toujours en ligne).
# Avant de se connecter, les jeux vérifient leur version via tagaya. Le DNS du serveur
# envoie tous les noms Nintendo vers ce serveur, où tagaya n'existait pas (404) : les
# jeux échouaient alors avec l'erreur 101-0502 (vu en SSSL).
# Le relais interroge Nintendo et garde chaque réponse en cache : hors ligne, la
# dernière réponse connue est resservie (le cache survit aux redémarrages : volume Docker).
proxy_cache_path /var/cache/nginx/tagaya levels=1:2 keys_zone=tagaya:2m max_size=100m inactive=3650d use_temp_path=off;

server {
    listen 80;
    server_name tagaya.wup.shop.nintendo.net tagaya.wup.shop.pretendo.cc
                tagaya-wup.cdn.nintendo.net tagaya-wup.cdn.pretendo.cc;

    # résolution par des DNS publics (le DNS interne renverrait vers ce serveur)
    resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout 3s;

    location / {
        set $tagaya_upstream tagaya.wup.shop.nintendo.net;
        if ($host ~ "cdn") {
            set $tagaya_upstream tagaya-wup.cdn.nintendo.net;
        }
        proxy_pass https://$tagaya_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $tagaya_upstream;
        proxy_set_header Host $tagaya_upstream;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_cache tagaya;
        proxy_cache_key $tagaya_upstream$request_uri;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Pretendo-LAN-Cache $upstream_cache_status;
    }
}
