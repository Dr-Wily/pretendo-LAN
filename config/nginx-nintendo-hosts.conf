# Pretendo LAN : traduction des noms Nintendo vers les noms Pretendo.
# Les Wii U en SSSL (et toute console qui n'utilise que le DNS du serveur) gardent les
# noms d'origine (*.nintendo.net, *.nintendowifi.net), alors que les services ne sont
# déclarés que sous *.pretendo.cc : sans cette traduction, tout sauf account.nintendo.net
# et conntest.nintendowifi.net répond 404 (liste des règles, Miiverse, Wii U Chat :
# erreur 101-0502…). Inkay fait la même traduction côté console.
# Les noms déclarés tels quels ailleurs (correspondance exacte) restent prioritaires.
server {
    listen 80;
    server_name ~^(?<nn_sub>.+)\.(?:nintendo\.net|nintendowifi\.net)$;

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $nn_sub.pretendo.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
