# Module de jeu : Mario Kart 8 (Wii U)
# Format décrit dans games/README.md

GAME_NAME="Mario Kart 8"
GAME_SERVICE=mario-kart-8

# Serveur Python réellement utilisé par Pretendo (le serveur Go
# PretendoNetwork/mario-kart-8-* n'a jamais fonctionné, cf. issue #125).
# b5f9f94 = version validée dans la PR #248 de pretendo-docker.
# Dépôt d'origine : https://github.com/Newtendo-Network/nex_mario_kart_8. Téléchargé depuis sa copie
# (fork) sur le GitHub du projet, qui reste disponible si l'origine disparaît.
GAME_REPO=https://github.com/Dr-Wily/nex_mario_kart_8.git
GAME_BRANCH=main
GAME_COMMIT=b5f9f94
# Sous-modules téléchargés depuis les copies du projet : « dépôt d'origine=copie », séparés par des espaces.
# EpicUsername12/nex_protocols_common_py a déjà changé de nom (Newtendo-Network, redirection de GitHub).
# grpc_py : PretendoNetwork, dépôt archivé.
GAME_MIRRORS="https://github.com/EpicUsername12/nex_protocols_common_py.git=https://github.com/Dr-Wily/nex_protocols_common_py.git
https://github.com/PretendoNetwork/grpc_py.git=https://github.com/Dr-Wily/grpc_py.git"
# Sous-modules inutiles, pas téléchargés (chemins depuis la racine du jeu). grpc-protobufs (archivé,
# « Deprecated ») ne sert qu'à refabriquer le code Python de grpc_py, déjà enregistré dans grpc_py.
GAME_SKIP_SUBMODULES="grpc_py/grpc-protobufs"

# Entrée dans pretendo_account.servers
GAME_SERVER_ID=1010EB00
GAME_TITLE_IDS="000500001010EB00 000500001010EC00 000500001010ED00"
GAME_DEVICE=1                 # 1 = Wii U, 2 = 3DS
GAME_COMMUNITY_ID=100000      # communauté Miiverse parente, exigée pour créer un tournoi
GAME_AUTH_PORT=6012           # UDP, publié sur l'hôte
GAME_SECURE_PORT=6013         # UDP, publié sur l'hôte

# Secrets propres au jeu : générés une fois puis conservés ({{SECRET_<NOM>}} dans env.tmpl)
GAME_SECRETS="SECURE_PASSWORD GRPC_API_KEY"

# Base PostgreSQL à créer ({{POSTGRES_URI}} dans env.tmpl) ; vide si inutile
GAME_POSTGRES_DB=""
